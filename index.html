<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortuna Laundry App</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/beuna-agency/main/beuna%20logo%20v2.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        pastel: { 
                            bg: '#F5F9FF', primary: '#5C9CE6', primary_light: '#E6F0FA', text: '#334155', 
                            plus: '#34D399', plus_bg: '#ECFDF5', minus: '#F87171', minus_bg: '#FEF2F2' 
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F5F9FF; color: #334155; padding-bottom: 90px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); }
        .bottom-sheet.open { transform: translateY(0); }
        .overlay { transition: opacity 0.3s; opacity: 0; pointer-events: none; }
        .overlay.open { opacity: 1; pointer-events: auto; }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { background-color: transparent; cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body class="antialiased">

    <div id="login-portal" class="fixed inset-0 bg-pastel-bg z-50 flex flex-col items-center justify-center p-6 transition-opacity duration-500">
        <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-blue-50 w-full max-w-sm text-center transform transition-transform duration-700 translate-y-0" id="login-card">
            <div class="w-20 h-20 bg-pastel-primary_light rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm border border-blue-100">
                <i class="fas fa-tshirt text-3xl text-pastel-primary"></i>
            </div>
            <h1 class="text-2xl font-semibold text-slate-800 mb-1">Fortuna Kasir</h1>
            <p class="text-xs text-slate-400 mb-8">Pencatatan Operasional Staf</p>
            <button onclick="doLogin()" class="w-full bg-pastel-primary text-white font-medium py-3.5 rounded-xl shadow-md shadow-blue-200 active:scale-95 transition-transform flex justify-center items-center">
                <span>Masuk Shift</span> <i class="fas fa-arrow-right ml-2 text-sm"></i>
            </button>
            <p class="text-[10px] text-slate-300 mt-6 tracking-wide">INTERNAL USE ONLY</p>
        </div>
    </div>

    <header class="bg-white px-5 py-4 shadow-sm sticky top-0 z-10 rounded-b-2xl border-b border-blue-50 backdrop-blur-md bg-white/90">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-semibold text-slate-800 tracking-tight" id="header-title">Kasir (RCHK)</h1>
                <p class="text-xs text-slate-400" id="header-subtitle">Pencatatan Keuangan</p>
            </div>
            <button onclick="refreshData()" class="text-slate-400 hover:text-pastel-primary transition-colors p-2 rounded-full bg-pastel-bg">
                <i class="fas fa-sync-alt" id="refresh-icon"></i>
            </button>
        </div>
        <div class="mt-2 flex items-center gap-2">
            <span class="text-[9px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-md font-medium"><i class="fas fa-shield-alt mr-1"></i> Data ditayangkan H-7</span>
            <span class="text-[9px] bg-amber-50 text-amber-600 px-2 py-0.5 rounded-md font-medium"><i class="fas fa-lock mr-1"></i> Edit H-3</span>
        </div>
    </header>

    <main class="px-5 py-4">
        <div id="tab-rchk" class="tab-content space-y-4"></div>
        <div id="tab-rkh" class="tab-content space-y-4 hidden"></div>
        <div id="tab-rsh" class="tab-content space-y-4 hidden"></div>
        <div class="mt-10 mb-8 text-center pb-4"><p class="text-[10px] text-blue-300 font-medium tracking-wide uppercase">cc developed by beuna system | beuna.xyz</p></div>
    </main>

    <button onclick="openModal(false)" class="fixed bottom-24 right-5 bg-pastel-primary text-white w-14 h-14 rounded-full shadow-lg shadow-blue-300 flex items-center justify-center text-xl z-20 hover:scale-105 active:scale-95 transition-transform" id="fab-btn">
        <i class="fas fa-plus"></i>
    </button>

    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-blue-50 flex justify-around py-3 pb-safe z-10 rounded-t-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
        <button onclick="switchTab('rchk', 'Kasir (RCHK)', 'Pencatatan Keuangan')" id="nav-rchk" class="nav-btn flex flex-col items-center text-pastel-primary w-1/3 transition-colors"><i class="fas fa-wallet text-xl mb-1"></i><span class="text-[10px] font-medium">Kasir</span></button>
        <button onclick="switchTab('rkh', 'Kiloan (RKH)', 'Pencatatan Pakaian Kiloan')" id="nav-rkh" class="nav-btn flex flex-col items-center text-slate-400 w-1/3 transition-colors"><i class="fas fa-weight-scale text-xl mb-1"></i><span class="text-[10px] font-medium">Kiloan</span></button>
        <button onclick="switchTab('rsh', 'Sortir (RSH)', 'Pencatatan Sortir Pakaian')" id="nav-rsh" class="nav-btn flex flex-col items-center text-slate-400 w-1/3 transition-colors"><i class="fas fa-tags text-xl mb-1"></i><span class="text-[10px] font-medium">Sortir</span></button>
    </nav>

    <div id="overlay" class="overlay fixed inset-0 bg-slate-900/40 z-30 backdrop-blur-sm" onclick="closeModal()"></div>
    <div id="bottom-sheet" class="bottom-sheet fixed bottom-0 w-full bg-white rounded-t-3xl shadow-2xl z-40 p-6 max-h-[85vh] overflow-y-auto hide-scrollbar border-t border-blue-100">
        <div class="w-12 h-1.5 bg-blue-100 rounded-full mx-auto mb-6"></div>
        <h2 class="text-lg font-semibold text-slate-800 mb-4 tracking-tight" id="modal-title">Tambah Data</h2>
        <form id="input-form" onsubmit="submitToWebhook(event)">
            <div id="dynamic-form-fields" class="space-y-4"></div>
            <button type="submit" id="submit-btn" class="w-full bg-pastel-primary text-white font-medium py-3.5 rounded-xl mt-6 shadow-md shadow-blue-200 active:scale-95 transition-transform flex justify-center items-center">Simpan Data</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/fortuna-webhook';
        let currentTab = 'rchk';
        let appData = { RCHK: [], RKH: [], RSH: [] };
        let currentEditId = null; 

        // Konstanta Waktu (Umur Transaksi)
        const MS_PER_DAY = 24 * 60 * 60 * 1000;
        const LIMIT_VIEW_MS = 7 * MS_PER_DAY; // Maksimal tampil H-7
        const LIMIT_EDIT_MS = 3 * MS_PER_DAY; // Maksimal edit H-3

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        
        function formatDateForInput(dateObj) {
            const y = dateObj.getFullYear(); const m = String(dateObj.getMonth() + 1).padStart(2, '0'); const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isStaffLoggedIn') === 'true') {
                document.getElementById('login-portal').style.display = 'none';
                loadDataFromN8N();
            }
        });

        function doLogin() {
            localStorage.setItem('isStaffLoggedIn', 'true');
            const portal = document.getElementById('login-portal');
            document.getElementById('login-card').style.transform = 'translateY(20px)';
            portal.style.opacity = '0';
            setTimeout(() => { portal.style.display = 'none'; }, 500);
            loadDataFromN8N();
        }

        async function loadDataFromN8N() {
            const icon = document.getElementById('refresh-icon'); icon.classList.add('fa-spin');
            try {
                const response = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "read" }) });
                const result = await response.json();
                if(result.status === "success") {
                    appData = result.data; 
                    renderAllData(); 
                }
            } catch (error) { alert("Gagal menarik data dari server."); } 
            finally { icon.classList.remove('fa-spin'); }
        }

        function refreshData() {
            document.querySelectorAll('.tab-content').forEach(el => { el.innerHTML = `<div class="text-center py-10 text-pastel-primary text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</div>`; });
            loadDataFromN8N();
        }

        // --- RENDER DATA DENGAN LOGIKA RBAC (Pagination H-7 & Lock H-3) ---
        function renderAllData() {
            const now = Date.now();

            // Render RCHK (Kasir)
            let rchkCards = '';
            [...appData.RCHK].reverse().forEach(item => {
                if(!item.ID) return;
                const itemTs = parseInt(item.ID);
                const ageMs = now - itemTs;
                
                // 1. VIEW LIMIT (Sembunyikan jika lebih dari 7 Hari)
                if (ageMs > LIMIT_VIEW_MS) return; 

                // 2. EDIT LIMIT (Kunci jika lebih dari 3 Hari)
                const isEditable = ageMs <= LIMIT_EDIT_MS;

                let jenis = 'Keterangan'; let nominal = 0; let isMin = false;
                if(item.DEBIT) { jenis = 'Debit'; nominal = item.DEBIT; } else if(item.QRIS) { jenis = 'QRIS'; nominal = item.QRIS; } else if(item.KREDIT) { jenis = 'Kredit'; nominal = item.KREDIT; isMin = true; } else if(item.KASBON) { jenis = 'Kasbon'; nominal = item.KASBON; isMin = true; }
                
                let actionBtn = isEditable 
                    ? `<button onclick="openModal(true, '${item.ID}')" class="text-blue-400 hover:text-pastel-primary p-2 bg-pastel-bg rounded-lg transition-colors"><i class="fas fa-pen text-sm"></i></button>`
                    : `<div class="p-2 text-slate-300" title="Data terkunci (H-3)"><i class="fas fa-lock text-sm"></i></div>`;

                rchkCards += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-50 relative mb-4"><div class="flex justify-between items-start mb-1"><span class="font-medium text-slate-700">${item.NAMA || '-'}</span><span class="text-sm font-semibold ${isMin ? 'text-pastel-minus' : 'text-pastel-plus'}">${isMin ? '-' : '+'} ${formatRp(nominal)}</span></div><div class="flex justify-between items-end mt-2"><div><span class="text-[10px] font-medium px-2 py-1 ${isMin ? 'bg-pastel-minus_bg text-pastel-minus' : 'bg-pastel-plus_bg text-pastel-plus'} rounded-md">${jenis}</span><p class="text-xs text-slate-400 mt-1">${item.KETERANGAN || '-'}</p></div>${actionBtn}</div></div>`;
            });
            document.getElementById('tab-rchk').innerHTML = rchkCards || `<div class="text-center py-10 text-slate-400 text-sm">Belum ada data di 7 hari terakhir.</div>`;

            // Fungsi Pembantu Render RKH/RSH
            const renderLaundryCard = (item) => {
                if(!item.ID) return '';
                const itemTs = parseInt(item.ID);
                const ageMs = now - itemTs;
                if (ageMs > LIMIT_VIEW_MS) return ''; // Hide > H-7
                const isEditable = ageMs <= LIMIT_EDIT_MS; // Lock > H-3
                
                let actionBtn = isEditable 
                    ? `<button onclick="openModal(true, '${item.ID}')" class="text-blue-400 hover:text-pastel-primary p-1.5 bg-pastel-bg rounded-md"><i class="fas fa-pen text-xs"></i></button>`
                    : `<div class="text-slate-300 p-1.5"><i class="fas fa-lock text-xs"></i></div>`;

                return `<div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-50 relative mb-4"><div class="flex justify-between items-center mb-2"><span class="font-medium text-slate-700">${item.NAMA || '-'}</span><div class="flex items-center gap-2"><span class="text-[10px] text-slate-400 bg-pastel-bg px-2 py-1 rounded-md">${item['TANGGAL MASUK'] || '-'} | ${item['JAM PENGERJAAN'] || ''}</span>${actionBtn}</div></div><div class="grid grid-cols-3 gap-2 mt-3"><div class="bg-pastel-primary_light p-2 rounded-xl text-center"><p class="text-[10px] text-pastel-primary font-medium">Berat</p><p class="font-semibold text-slate-700">${item.KG || 0} Kg</p></div><div class="bg-pastel-bg p-2 rounded-xl text-center"><p class="text-[10px] text-slate-500">Pcs</p><p class="font-semibold text-slate-600">${item.PCS || 0}</p></div><div class="bg-pastel-bg p-2 rounded-xl text-center"><p class="text-[10px] text-slate-500">Keranjang</p><p class="font-semibold text-slate-600">#${item['NOMOR KERANJANG'] || '-'}</p></div></div><p class="text-[10px] font-medium text-slate-400 mt-3 border-t border-pastel-bg pt-2"><i class="fas fa-tag mr-1 text-pastel-primary"></i> ${item['JENIS SATUAN'] || '-'}</p></div>`;
            };

            document.getElementById('tab-rkh').innerHTML = [...appData.RKH].reverse().map(i => renderLaundryCard(i)).join('') || `<div class="text-center py-10 text-slate-400 text-sm">Belum ada data di 7 hari terakhir.</div>`;
            document.getElementById('tab-rsh').innerHTML = [...appData.RSH].reverse().map(i => renderLaundryCard(i)).join('') || `<div class="text-center py-10 text-slate-400 text-sm">Belum ada data di 7 hari terakhir.</div>`;
        }

        function switchTab(tabId, title, subtitle) {
            currentTab = tabId;
            document.getElementById('header-title').innerText = title; document.getElementById('header-subtitle').innerText = subtitle;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden')); document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-pastel-primary'); btn.classList.add('text-slate-400'); });
            document.getElementById(`nav-${tabId}`).classList.add('text-pastel-primary'); document.getElementById(`nav-${tabId}`).classList.remove('text-slate-400');
        }

        function openModal(isEdit = false, itemId = null) {
            currentEditId = isEdit ? itemId : null; 
            const formFields = document.getElementById('dynamic-form-fields');
            document.getElementById('modal-title').innerText = isEdit ? `Edit Data` : `Tambah Data`;
            document.getElementById('submit-btn').innerHTML = isEdit ? 'Update Data' : 'Simpan Data';

            let oldData = {}; if(isEdit) oldData = appData[currentTab.toUpperCase()].find(item => item.ID == itemId) || {};

            if(currentTab === 'rchk') {
                let oldJenis = 'Debit'; let oldNom = '';
                if(isEdit) { if(oldData.DEBIT) { oldJenis = 'Debit'; oldNom = oldData.DEBIT; } else if(oldData.QRIS) { oldJenis = 'QRIS'; oldNom = oldData.QRIS; } else if(oldData.KREDIT) { oldJenis = 'Kredit'; oldNom = oldData.KREDIT; } else if(oldData.KASBON) { oldJenis = 'Kasbon'; oldNom = oldData.KASBON; } }
                formFields.innerHTML = `<div><label class="text-xs font-medium text-slate-500 ml-1">Nama / Keterangan</label><input type="text" id="input-nama" value="${oldData.NAMA || ''}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-medium text-slate-500 ml-1">Jenis Transaksi</label><select id="input-jenis" class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"><option value="Debit" ${oldJenis === 'Debit' ? 'selected' : ''}>CASH (Masuk)</option><option value="QRIS" ${oldJenis === 'QRIS' ? 'selected' : ''}>QRIS (Masuk)</option><option value="Kredit" ${oldJenis === 'Kredit' ? 'selected' : ''}>KREDIT (Keluar)</option><option value="Kasbon" ${oldJenis === 'Kasbon' ? 'selected' : ''}>KASBON (Piutang)</option></select></div><div><label class="text-xs font-medium text-slate-500 ml-1">Nominal (Rp)</label><input type="number" id="input-nominal" value="${oldNom}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"></div></div><div><label class="text-xs font-medium text-slate-500 ml-1">Catatan Tambahan</label><input type="text" id="input-ket" value="${oldData.KETERANGAN || ''}" class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700" placeholder="-"></div>`;
            } else {
                const padZero = (num) => String(num).padStart(2, '0');
                const formatDateForHTMLInput = (dateStr) => { if (!dateStr) return ''; const parts = dateStr.split('/'); return parts.length === 3 ? `${parts[2]}-${padZero(parts[1])}-${padZero(parts[0])}` : ''; };

                let tMasuk = formatDateForHTMLInput(new Date().toLocaleDateString('id-ID')); let tNota = formatDateForHTMLInput(new Date().toLocaleDateString('id-ID')); let jam = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                if (isEdit && oldData['TANGGAL MASUK']) tMasuk = formatDateForHTMLInput(oldData['TANGGAL MASUK']); if (isEdit && oldData['TANGGAL NOTA']) tNota = formatDateForHTMLInput(oldData['TANGGAL NOTA']); if (isEdit && oldData['JAM PENGERJAAN']) jam = oldData['JAM PENGERJAAN'].replace('.', ':').substring(0,5);
                const sat = oldData['JENIS SATUAN'] || '-';

                formFields.innerHTML = `<div class="grid grid-cols-2 gap-3 mb-2"><div><label class="text-xs font-medium text-slate-500 ml-1">Tgl Masuk</label><input type="date" id="input-tgl-masuk" value="${tMasuk}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-3 py-3 outline-none focus:border-pastel-primary text-slate-700 text-sm"></div><div><label class="text-xs font-medium text-slate-500 ml-1">Jam Kerja</label><input type="time" id="input-jam" value="${jam}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-3 py-3 outline-none focus:border-pastel-primary text-slate-700 text-sm"></div></div><div><label class="text-xs font-medium text-slate-500 ml-1">Tgl Nota</label><input type="date" id="input-tgl-nota" value="${tNota}" required class="w-full mt-1 mb-2 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"></div><div><label class="text-xs font-medium text-slate-500 ml-1">Nama Pelanggan</label><input type="text" id="input-nama" value="${oldData.NAMA || ''}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"></div><div class="grid grid-cols-3 gap-3"><div><label class="text-xs font-medium text-slate-500 ml-1">Berat (Kg)</label><input type="number" step="0.1" id="input-kg" value="${oldData.KG || ''}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-3 py-3 outline-none focus:border-pastel-primary text-center text-slate-700"></div><div><label class="text-xs font-medium text-slate-500 ml-1">Pcs</label><input type="number" id="input-pcs" value="${oldData.PCS || ''}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-3 py-3 outline-none focus:border-pastel-primary text-center text-slate-700"></div><div><label class="text-xs font-medium text-slate-500 ml-1">Keranjang</label><input type="text" id="input-krj" value="${oldData['NOMOR KERANJANG'] || ''}" required class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-3 py-3 outline-none focus:border-pastel-primary text-center text-slate-700"></div></div><div class="mt-4"><label class="text-xs font-medium text-slate-500 ml-1">Jenis Satuan</label><select id="input-satuan" class="w-full mt-1 bg-pastel-bg border border-blue-50 rounded-xl px-4 py-3 outline-none focus:border-pastel-primary text-slate-700"><option value="-" ${sat === '-' ? 'selected' : ''}>Baju / Pcs Bebas (Standar)</option><option value="Karpet Tebal" ${sat === 'Karpet Tebal' ? 'selected' : ''}>Karpet Tebal</option><option value="Karpet Hambal" ${sat === 'Karpet Hambal' ? 'selected' : ''}>Karpet Hambal</option><option value="Karpet Macan" ${sat === 'Karpet Macan' ? 'selected' : ''}>Karpet Macan</option><option value="Kasur Sedang" ${sat === 'Kasur Sedang' ? 'selected' : ''}>Kasur Sedang</option><option value="Taplak Panjang" ${sat === 'Taplak Panjang' ? 'selected' : ''}>Taplak Panjang</option><option value="Karpet Turki Besar" ${sat === 'Karpet Turki Besar' ? 'selected' : ''}>Karpet Turki Besar</option></select></div>`;
            }
            document.getElementById('overlay').classList.add('open'); document.getElementById('bottom-sheet').classList.add('open');
        }

        function closeModal() { document.getElementById('overlay').classList.remove('open'); document.getElementById('bottom-sheet').classList.remove('open'); currentEditId = null; }

        function formatDateForSheetSave(dateString) {
            if(!dateString) return ''; const parts = dateString.split('-');
            if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`; return dateString; 
        }

        async function submitToWebhook(e) {
            e.preventDefault(); const btn = document.getElementById('submit-btn'); const isEditing = currentEditId !== null;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> ${isEditing ? 'Memperbarui...' : 'Menyimpan...'}`;

            const targetId = isEditing ? currentEditId : Date.now().toString();
            let payloadData = {};
            if (currentTab === 'rchk') {
                const jenis = document.getElementById('input-jenis').value; const nominal = document.getElementById('input-nominal').value;
                payloadData = { "id": targetId, "NAMA": document.getElementById('input-nama').value, "KREDIT": jenis === 'Kredit' ? nominal : "", "KASBON": jenis === 'Kasbon' ? nominal : "", "QRIS": jenis === 'QRIS' ? nominal : "", "DEBIT": jenis === 'Debit' ? nominal : "", "KETERANGAN": document.getElementById('input-ket').value };
            } else {
                const rMasuk = document.getElementById('input-tgl-masuk').value; const rNota = document.getElementById('input-tgl-nota').value; const rJam = document.getElementById('input-jam').value;
                payloadData = { "id": targetId, "TANGGAL MASUK": formatDateForSheetSave(rMasuk), "NAMA": document.getElementById('input-nama').value, "TANGGAL NOTA": formatDateForSheetSave(rNota), "JAM PENGERJAAN": rJam.replace(':', '.'), "PCS": document.getElementById('input-pcs').value, "KG": document.getElementById('input-kg').value, "NOMOR KERANJANG": document.getElementById('input-krj').value, "JENIS SATUAN": document.getElementById('input-satuan').value };
            }
            try { const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: currentTab, data: payloadData }) }); if(res.ok) { closeModal(); refreshData(); } else alert("Gagal menyambung ke Database."); } catch (err) { alert("Kesalahan jaringan."); } finally { btn.innerHTML = 'Simpan Data'; }
        }
    </script>
</body>
</html>
