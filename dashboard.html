<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortuna Laundry — V3</title>

<style>
:root{
  --g:#0f6b57;
  --bg:#f5f7f6;
  --line:#e4e9e6;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:#18221f;
}

.wrap{
  max-width:1250px;
  margin:auto;
  padding:28px 20px;
}

.top,
.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.top{
  margin-bottom:20px;
}

.top h1{
  margin:0;
  font-size:25px;
}

.muted{
  color:#7b8581;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
  margin:18px 0;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 24px #10231d0a;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.layout{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:18px;
}

.form{
  display:grid;
  gap:11px;
}

label{
  font-size:11px;
  font-weight:bold;
  color:#68726f;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fafbfa;
  font:inherit;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:var(--g);
  color:white;
}

.ghost{
  background:white;
  border:1px solid var(--line);
}

.notice{
  margin:0 0 18px;
  padding:14px 16px;
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
}

.tablewrap{
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.table th,
.table td{
  text-align:left;
  padding:12px 9px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.table th{
  font-size:10px;
  color:#7b8581;
  text-transform:uppercase;
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  background:#eef1ef;
  font-size:10px;
  font-weight:bold;
}

.ready{
  background:#dff3ed;
  color:var(--g);
}

.late{
  background:#ffe7e7;
  color:#a63c3c;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.actions button{
  font-size:10px;
  padding:7px 8px;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:560px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="top">

    <div>
      <h1>Fortuna Laundry</h1>

      <div class="muted">
        Dashboard operasional — V3
      </div>
    </div>

    <button
      class="ghost"
      onclick="load()">
      ↻ Refresh
    </button>

  </div>


  <!-- NOTIFICATION -->
  <div
    id="notice"
    class="notice">
    Memuat data...
  </div>


  <!-- STATISTICS -->
  <div class="grid">

    <div class="card stat">
      <small>Total</small>
      <strong id="total">0</strong>
    </div>

    <div class="card stat">
      <small>Diterima</small>
      <strong id="diterima">0</strong>
    </div>

    <div class="card stat">
      <small>Diproses</small>
      <strong id="diproses">0</strong>
    </div>

    <div class="card stat">
      <small>QC</small>
      <strong id="qc">0</strong>
    </div>

    <div class="card stat">
      <small>Siap</small>
      <strong id="siap">0</strong>
    </div>

    <div class="card stat">
      <small>Selesai</small>
      <strong id="selesai">0</strong>
    </div>

  </div>


  <!-- MAIN -->
  <div class="layout">


    <!-- ORDER BARU -->
    <div class="card">

      <h2>Order Baru</h2>

      <form
        id="form"
        class="form">

        <div>

          <label>NAMA</label>

          <input
            id="nama"
            required>

        </div>


        <div>

          <label>NO WHATSAPP</label>

          <input
            id="wa">

        </div>


        <div>

          <label>PAKET / CUCIAN</label>

          <select id="paket">

            <option>FLEKSIBEL</option>

            <option>CUCI REGULER</option>

            <option>CUCI KOMPLIT REGULER</option>

            <option>SETRIKA REGULER</option>

            <option>EXPRESS 1 HARI</option>

            <option>EXPRESS 3 JAM</option>

            <option>EXPRESS 6 JAM</option>

            <option>CUCI EXPRESS 1 HARI</option>

            <option>CUCI EXPRESS 3 JAM</option>

            <option>CUCI EXPRESS 6 JAM</option>

            <option>SETRIKA EXPRESS 1 HARI</option>

            <option>SETRIKA EXPRESS 3 JAM</option>

            <option>SETRIKA EXPRESS 6 JAM</option>

          </select>

        </div>


        <div class="row">

          <div>

            <label>BERAT KG</label>

            <input
              id="berat"
              type="number"
              step="0.1"
              value="1">

          </div>


          <div>

            <label>TAGIHAN</label>

            <input
              id="tagihan"
              type="number"
              value="0">

          </div>

        </div>


        <button
          class="primary"
          id="save"
          type="submit">

          Simpan Order

        </button>

      </form>

    </div>


    <!-- ORDER TABLE -->
    <div class="card">

      <div class="bar">

        <h2>Order</h2>

        <input
          id="q"
          placeholder="Cari nama / kode..."
          oninput="render()">

      </div>


      <div class="tablewrap">

        <table class="table">

          <thead>

            <tr>

              <th>Kode</th>

              <th>Pelanggan</th>

              <th>Paket</th>

              <th>Berat</th>

              <th>Tagihan</th>

              <th>Status</th>

              <th>Aksi</th>

            </tr>

          </thead>


          <tbody id="body">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
  'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/fortuna-v3';


/* =========================================================
   STATE
========================================================= */

let orders = [];


/* =========================================================
   ESCAPE HTML
========================================================= */

const esc = x =>
  String(x ?? '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[m])
    );


/* =========================================================
   API
========================================================= */

async function api(action, data = {}){

  const r = await fetch(
    API,
    {
      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        action,
        data
      })
    }
  );


  const t = await r.text();

  let j;

  try{

    j = JSON.parse(t);

  }catch{

    throw Error(
      'Response bukan JSON: ' +
      t.slice(0,160)
    );

  }


  if(
    !r.ok ||
    j.status === 'error'
  ){

    throw Error(
      j.message ||
      'Request gagal'
    );

  }


  return j;

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function load(){

  const n =
    document.getElementById('notice');

  n.textContent =
    'Memuat data...';


  try{

    const j =
      await api('dashboard');


    orders =
      j.data?.orders || [];


    const s =
      j.data?.summary || {};


    [
      'total',
      'diterima',
      'diproses',
      'qc',
      'siap',
      'selesai'
    ].forEach(k => {

      document.getElementById(k)
        .textContent =
        s[k] || 0;

    });


    n.textContent =
      `${s.siap || 0} order siap diambil • ` +
      `${s.overdue || 0} melewati deadline`;


    render();


  }catch(e){

    n.textContent =
      'Gagal menarik data: ' +
      e.message;

  }

}


/* =========================================================
   CHECK DEADLINE
========================================================= */

function late(o){

  if(
    ['SIAP','SELESAI'].includes(o.STATUS) ||
    !o.DEADLINE ||
    o.DEADLINE === 'FLEKSIBEL'
  ){

    return false;

  }


  const t =
    Date.parse(o.DEADLINE);


  return (
    !isNaN(t) &&
    t < Date.now()
  );

}


/* =========================================================
   RENDER TABLE
========================================================= */

function render(){

  const q =
    document
      .getElementById('q')
      .value
      .toLowerCase();


  const a =
    orders.filter(o =>
      (
        o.NAMA +
        ' ' +
        o.ID +
        ' ' +
        o.CODE +
        ' ' +
        o['PAKET/CUCIAN']
      )
      .toLowerCase()
      .includes(q)
    );


  document.getElementById('body')
    .innerHTML =

    a.length

    ?

    a.map(o => {

      const id =
        esc(
          o.ID ||
          o.CODE
        );


      return `

        <tr>

          <td>

            <b>
              ${id}
            </b>

            <br>

            <small>
              ${esc(o.START)}
            </small>

          </td>


          <td>

            <b>
              ${esc(o.NAMA)}
            </b>

            <br>

            <small>
              ${esc(o['NO WA'])}
            </small>

          </td>


          <td>
            ${esc(o['PAKET/CUCIAN'])}
          </td>


          <td>
            ${esc(o.BERAT)} kg
          </td>


          <td>

            Rp ${Number(
              String(
                o.TAGIHAN || 0
              )
              .replace(/\D/g,'')
              || 0
            ).toLocaleString('id-ID')}

          </td>


          <td>

            <span
              class="badge
              ${o.STATUS === 'SIAP' ? 'ready' : ''}
              ${late(o) ? 'late' : ''}">

              ${
                late(o)
                ? 'TERLAMBAT'
                : esc(o.STATUS)
              }

            </span>

          </td>


          <td>

            <div class="actions">


              <button
                class="ghost"
                onclick="status('${id}','DIPROSES')">

                Proses

              </button>


              <button
                class="ghost"
                onclick="status('${id}','QC')">

                QC

              </button>


              <button
                class="ghost"
                onclick="status('${id}','SIAP')">

                Siap

              </button>


              <button
                class="ghost"
                onclick="status('${id}','SELESAI')">

                Selesai

              </button>


              <button
                class="primary"
                onclick="wa('${id}')">

                WA

              </button>


            </div>

          </td>

        </tr>

      `;

    }).join('')

    :

    `

      <tr>

        <td
          colspan="7"
          style="
            text-align:center;
            padding:35px;
          ">

          Belum ada data.

        </td>

      </tr>

    `;

}


/* =========================================================
   WHATSAPP
========================================================= */

function wa(id){

  const o =
    orders.find(
      x =>
        String(
          x.ID ||
          x.CODE
        ) === String(id)
    );


  if(
    !o ||
    !o['NO WA']
  ){

    return;

  }


  let n =
    o['NO WA']
      .replace(/\D/g,'');


  if(
    n.startsWith('0')
  ){

    n =
      '62' +
      n.slice(1);

  }


  const msg =

`Halo ${o.NAMA},

Kami informasikan bahwa cucian dengan kode ${o.CODE || o.ID} sudah selesai dan siap diambil di Fortuna Laundry.

Terima kasih.`;


  open(
    'https://wa.me/' +
    n +
    '?text=' +
    encodeURIComponent(msg),

    '_blank'
  );

}


/* =========================================================
   UPDATE STATUS
========================================================= */

async function status(id,s){

  try{

    await api(
      'status_update',
      {
        ID:id,
        STATUS:s
      }
    );


    await load();


  }catch(e){

    alert(
      'Gagal update status: ' +
      e.message
    );

  }

}


/* =========================================================
   CREATE ORDER
========================================================= */

document
  .getElementById('form')
  .onsubmit = async e => {

    e.preventDefault();


    const b =
      document.getElementById('save');


    b.disabled = true;

    b.textContent =
      'Menyimpan...';


    try{

      const j =
        await api(
          'order_create',
          {
            NAMA:
              nama.value,

            NO_WA:
              wa.value,

            PAKET:
              paket.value,

            BERAT:
              berat.value,

            TAGIHAN:
              tagihan.value
          }
        );


      alert(
        'Order berhasil: ' +
        (
          j.data?.order?.CODE ||
          ''
        )
      );


      e.target.reset();


      berat.value = 1;

      tagihan.value = 0;


      await load();


    }catch(x){

      alert(
        'Gagal membuat order.\n\n' +
        x.message
      );


    }finally{

      b.disabled = false;

      b.textContent =
        'Simpan Order';

    }

  };


/* =========================================================
   INITIAL LOAD
========================================================= */

load();

</script>

</body>
</html>
