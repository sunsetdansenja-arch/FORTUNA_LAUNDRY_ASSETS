<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortuna Laundry — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{
  fortuna:{bg:'#F4F2EE',green:'#0F5A47',green2:'#0B4638',orange:'#F6A04D',text:'#202522'}
}}}}
</script>
<style>
body{background:#F4F2EE;color:#202522;font-family:'Plus Jakarta Sans',sans-serif}
.card{background:#fff;border:1px solid #ece9e3;border-radius:20px;box-shadow:0 8px 30px rgba(25,35,30,.05)}
.btn{transition:.18s ease}.btn:active{transform:scale(.97)}
.status-pill{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}
.s-DITERIMA{background:#eef2ff;color:#4f46e5}.s-DIPROSES{background:#fff7ed;color:#c2410c}
.s-QC{background:#f5f3ff;color:#7c3aed}.s-SIAP{background:#ecfdf5;color:#047857}
.s-SELESAI{background:#f1f5f9;color:#475569}
.table-wrap{max-height:560px;overflow:auto}.table-wrap::-webkit-scrollbar{width:7px}.table-wrap::-webkit-scrollbar-thumb{background:#d8d5cf;border-radius:20px}
.toast{transform:translateY(-12px);opacity:0;pointer-events:none;transition:.22s ease}.toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
.modal{opacity:0;pointer-events:none;transition:.2s}.modal.show{opacity:1;pointer-events:auto}
.modal-box{transform:translateY(15px);transition:.2s}.modal.show .modal-box{transform:translateY(0)}
@media(max-width:768px){.table-wrap{max-height:none}.desktop-only{display:none}}
</style>
</head>
<body class="min-h-screen pb-10">

<header class="sticky top-0 z-30 bg-[#F4F2EE]/95 backdrop-blur border-b border-[#e7e3dc]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
    <div>
      <div class="text-xs font-bold tracking-[.18em] text-[#0F5A47] uppercase">Fortuna Laundry</div>
      <h1 class="text-xl sm:text-2xl font-extrabold mt-1">Operasional Dashboard</h1>
    </div>
    <button onclick="loadDashboard()" id="refreshBtn" class="btn bg-white border border-slate-200 rounded-xl px-4 py-2.5 font-bold text-sm">
      <i id="refreshIcon" class="fa-solid fa-rotate-right mr-2"></i>Refresh
    </button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">

  <section class="grid grid-cols-2 lg:grid-cols-6 gap-3">
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">TOTAL</div><div id="sum-total" class="text-2xl font-extrabold mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">DITERIMA</div><div id="sum-diterima" class="text-2xl font-extrabold mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">DIPROSES</div><div id="sum-diproses" class="text-2xl font-extrabold mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">QC</div><div id="sum-qc" class="text-2xl font-extrabold mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">SIAP</div><div id="sum-siap" class="text-2xl font-extrabold mt-1 text-[#0F5A47]">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500 font-bold">SELESAI</div><div id="sum-selesai" class="text-2xl font-extrabold mt-1">0</div></div>
  </section>

  <section class="grid lg:grid-cols-[360px_1fr] gap-5">
    <div class="card p-5 h-fit lg:sticky lg:top-24">
      <div class="flex items-center justify-between mb-5">
        <div><h2 class="font-extrabold text-lg">Order Baru</h2><p class="text-xs text-slate-500 mt-1">Input order pelanggan</p></div>
        <span class="w-9 h-9 rounded-xl bg-[#E6EFEA] text-[#0F5A47] flex items-center justify-center"><i class="fa-solid fa-plus"></i></span>
      </div>
      <form id="orderForm" onsubmit="createOrder(event)" class="space-y-3">
        <div><label class="text-[10px] font-extrabold text-slate-500">NAMA</label>
          <input id="f-nama" required class="w-full mt-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 outline-none focus:ring-2 focus:ring-[#0F5A47]/20" placeholder="Nama pelanggan">
        </div>
        <div><label class="text-[10px] font-extrabold text-slate-500">NO WHATSAPP</label>
          <input id="f-wa" class="w-full mt-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 outline-none focus:ring-2 focus:ring-[#0F5A47]/20" placeholder="08xxxxxxxxxx">
        </div>
        <div><label class="text-[10px] font-extrabold text-slate-500">PAKET / CUCIAN</label>
          <select id="f-paket" class="w-full mt-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 outline-none">
            <option>FLEKSIBEL</option>
            <option>CUCI KOMPLIT REGULER</option>
            <option>CUCI REGULER</option>
            <option>SETRIKA REGULER</option>
            <option>EXPRESS 1 HARI</option>
            <option>CUCI EXPRESS 1 HARI</option>
            <option>SETRIKA EXPRESS 1 HARI</option>
            <option>EXPRESS 3 JAM</option>
            <option>CUCI EXPRESS 3 JAM</option>
            <option>SETRIKA EXPRESS 3 JAM</option>
            <option>EXPRESS 6 JAM</option>
            <option>CUCI EXPRESS 6 JAM</option>
            <option>SETRIKA EXPRESS 6 JAM</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-[10px] font-extrabold text-slate-500">BERAT (KG)</label>
            <input id="f-berat" type="number" step="0.1" min="0" value="1" required class="w-full mt-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3">
          </div>
          <div><label class="text-[10px] font-extrabold text-slate-500">TAGIHAN</label>
            <input id="f-tagihan" type="number" min="0" value="0" required class="w-full mt-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3">
          </div>
        </div>
        <button id="saveBtn" class="btn w-full bg-[#0F5A47] text-white rounded-xl py-3.5 font-extrabold">
          <i class="fa-solid fa-floppy-disk mr-2"></i>Simpan Order
        </button>
      </form>
    </div>

    <div class="card overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div><h2 class="font-extrabold text-lg">Order</h2><p id="orderCountText" class="text-xs text-slate-500 mt-1">0 order</p></div>
        <div class="relative sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
          <input id="search" oninput="renderOrders()" class="w-full rounded-xl border border-slate-200 pl-9 pr-3 py-3 text-sm outline-none" placeholder="Cari nama / kode...">
        </div>
      </div>
      <div class="table-wrap">
        <table class="w-full text-sm">
          <thead class="bg-[#faf9f7] sticky top-0 z-10">
            <tr class="text-[10px] text-slate-500 font-extrabold">
              <th class="text-left px-4 py-3">KODE</th>
              <th class="text-left px-4 py-3">PELANGGAN</th>
              <th class="text-left px-4 py-3">PAKET</th>
              <th class="text-left px-4 py-3">BERAT</th>
              <th class="text-left px-4 py-3">TAGIHAN</th>
              <th class="text-left px-4 py-3">STATUS</th>
              <th class="text-right px-4 py-3">AKSI</th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden text-center py-12 text-slate-400">
        <i class="fa-solid fa-box-open text-3xl mb-3"></i><div class="font-bold">Tidak ada order</div>
      </div>
    </div>
  </section>

  <section class="card p-5">
    <div class="flex items-center justify-between mb-3">
      <div><h2 class="font-extrabold">Action Center</h2><p class="text-xs text-slate-500 mt-1">Perhatian operasional tanpa log panjang</p></div>
      <button onclick="scrollToOrders()" class="text-xs font-extrabold text-[#0F5A47]">Lihat order</button>
    </div>
    <div id="actionCenter" class="grid sm:grid-cols-3 gap-3"></div>
  </section>
</main>

<div id="toast" class="toast fixed top-5 right-5 z-50 max-w-sm bg-[#202522] text-white rounded-xl px-4 py-3 shadow-xl text-sm font-bold"></div>

<div id="modal" class="modal fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-3" onclick="if(event.target===this)closeModal()">
  <div class="modal-box bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
    <div class="flex justify-between items-start">
      <div><div class="text-xs font-extrabold text-[#0F5A47]">UPDATE STATUS</div><h3 id="modalTitle" class="text-xl font-extrabold mt-1">Order</h3></div>
      <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalInfo" class="mt-4 p-4 rounded-2xl bg-slate-50 text-sm"></div>
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button onclick="updateStatus('DITERIMA')" class="btn rounded-xl py-3 bg-indigo-50 text-indigo-700 font-extrabold">DITERIMA</button>
      <button onclick="updateStatus('DIPROSES')" class="btn rounded-xl py-3 bg-orange-50 text-orange-700 font-extrabold">DIPROSES</button>
      <button onclick="updateStatus('QC')" class="btn rounded-xl py-3 bg-violet-50 text-violet-700 font-extrabold">QC</button>
      <button onclick="updateStatus('SIAP')" class="btn rounded-xl py-3 bg-emerald-50 text-emerald-700 font-extrabold">SIAP</button>
      <button onclick="updateStatus('SELESAI')" class="btn col-span-2 rounded-xl py-3 bg-slate-100 text-slate-700 font-extrabold">SELESAI / DIAMBIL</button>
    </div>
  </div>
</div>

<script>
const WEBHOOK_URL='https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/fortuna-v3';
let orders=[], summary={}, selectedOrder=null, busy=false;

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const rupiah=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(Number(v)||0);

function toast(msg,ok=true){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show fixed top-5 right-5 z-50 max-w-sm rounded-xl px-4 py-3 shadow-xl text-sm font-bold '+(ok?'bg-[#0F5A47] text-white':'bg-red-600 text-white');
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),3000);
}

async function api(action,data={}){
  const r=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data})});
  const text=await r.text();
  let j; try{j=JSON.parse(text)}catch{throw new Error('Response backend bukan JSON: '+text.slice(0,180))}
  if(!r.ok) throw new Error(j.message||j.error||('HTTP '+r.status));
  if(j.status && j.status!=='success') throw new Error(j.message||'Backend gagal');
  return j;
}

async function loadDashboard(silent=false){
  if(busy)return;
  const icon=document.getElementById('refreshIcon'); icon.classList.add('fa-spin');
  try{
    const j=await api('read');
    const d=j.data||{};
    orders=Array.isArray(d.orders)?d.orders:[];
    summary=d.summary||{};
    renderSummary(); renderOrders(); renderActionCenter();
    if(!silent) toast('Data berhasil diperbarui');
  }catch(e){
    console.error(e); toast('Gagal memuat data: '+e.message,false);
  }finally{icon.classList.remove('fa-spin')}
}

function renderSummary(){
  ['total','diterima','diproses','qc','siap','selesai'].forEach(k=>document.getElementById('sum-'+k).textContent=summary[k]??0);
}

function normalizeOrder(o){
  return {
    ...o,
    CODE:o.CODE||o.KODE||o.ID||'-',
    ID:o.ID||o.CODE||o.KODE||'',
    NAMA:o.NAMA||'-',
    PAKET:o.PAKET||o['PAKET/CUCIAN']||'-',
    BERAT:o.BERAT||'0',
    TAGIHAN:o.TAGIHAN||'0',
    STATUS:String(o.STATUS||'DITERIMA').toUpperCase(),
    NO_WA:o.NO_WA||o['NO WA']||'',
    LINK_WA:o['LINK WA']||o.LINK_WA||'',
    DEADLINE:o.DEADLINE||'-'
  };
}

function renderOrders(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const list=orders.map(normalizeOrder).filter(o=>(o.NAMA+' '+o.CODE+' '+o.PAKET+' '+o.STATUS).toLowerCase().includes(q));
  document.getElementById('orderCountText').textContent=list.length+' order';
  const tbody=document.getElementById('orderRows');
  document.getElementById('emptyState').classList.toggle('hidden',list.length!==0);
  tbody.innerHTML=list.map(o=>`
    <tr class="border-t border-slate-100 hover:bg-slate-50/70">
      <td class="px-4 py-3 align-top"><div class="font-extrabold">${esc(o.CODE)}</div><div class="text-[10px] text-slate-400">${esc(o.START||'')}</div></td>
      <td class="px-4 py-3 align-top"><div class="font-bold">${esc(o.NAMA)}</div><div class="text-[10px] text-slate-400">${esc(o.NO_WA)}</div></td>
      <td class="px-4 py-3 align-top max-w-[190px]">${esc(o.PAKET)}</td>
      <td class="px-4 py-3 align-top">${esc(o.BERAT)} kg</td>
      <td class="px-4 py-3 align-top font-bold">${rupiah(o.TAGIHAN)}</td>
      <td class="px-4 py-3 align-top"><span class="status-pill s-${esc(o.STATUS)}">${esc(o.STATUS)}</span></td>
      <td class="px-4 py-3 align-top text-right whitespace-nowrap">
        <button class="btn text-xs font-extrabold rounded-lg bg-slate-100 px-3 py-2 mr-1" onclick='openStatus(${JSON.stringify(o).replace(/</g,"\\u003c")})'>Aksi</button>
        ${o.LINK_WA?`<a target="_blank" href="${esc(o.LINK_WA)}" class="btn inline-block text-xs font-extrabold rounded-lg bg-emerald-50 text-emerald-700 px-3 py-2">WA</a>`:''}
      </td>
    </tr>`).join('');
}

function renderActionCenter(){
  const ready=summary.siap||0, overdue=summary.overdue||0, processing=(summary.diproses||0)+(summary.qc||0);
  document.getElementById('actionCenter').innerHTML=`
    <button onclick="filterStatus('SIAP')" class="text-left rounded-2xl border border-emerald-100 bg-emerald-50 p-4">
      <div class="text-2xl font-extrabold text-emerald-700">${ready}</div><div class="text-xs font-extrabold text-emerald-800 mt-1">SIAP DIAMBIL</div>
    </button>
    <button onclick="filterStatus('DIPROSES')" class="text-left rounded-2xl border border-orange-100 bg-orange-50 p-4">
      <div class="text-2xl font-extrabold text-orange-700">${processing}</div><div class="text-xs font-extrabold text-orange-800 mt-1">SEDANG DIPROSES / QC</div>
    </button>
    <button onclick="filterStatus('OVERDUE')" class="text-left rounded-2xl border border-red-100 bg-red-50 p-4">
      <div class="text-2xl font-extrabold text-red-700">${overdue}</div><div class="text-xs font-extrabold text-red-800 mt-1">MELEWATI DEADLINE</div>
    </button>`;
}

function filterStatus(s){
  const input=document.getElementById('search');
  input.value='';
  const list=orders.map(normalizeOrder);
  if(s==='OVERDUE'){
    const overdue=list.filter(o=>o.DEADLINE&&String(o.DEADLINE).toUpperCase()!=='FLEKSIBEL'&&['DITERIMA','DIPROSES','QC','SIAP'].includes(o.STATUS));
    document.getElementById('orderRows').innerHTML=overdue.map(o=>rowHTML(o)).join('');
    document.getElementById('orderCountText').textContent=overdue.length+' order overdue';
    return;
  }
  const filtered=list.filter(o=>o.STATUS===s||(s==='DIPROSES'&&o.STATUS==='QC'));
  document.getElementById('orderRows').innerHTML=filtered.map(o=>rowHTML(o)).join('');
  document.getElementById('orderCountText').textContent=filtered.length+' order';
  document.getElementById('emptyState').classList.toggle('hidden',filtered.length!==0);
}
function rowHTML(o){
 return `<tr class="border-t border-slate-100"><td class="px-4 py-3 font-extrabold">${esc(o.CODE)}</td><td class="px-4 py-3 font-bold">${esc(o.NAMA)}</td><td class="px-4 py-3">${esc(o.PAKET)}</td><td class="px-4 py-3">${esc(o.BERAT)} kg</td><td class="px-4 py-3">${rupiah(o.TAGIHAN)}</td><td class="px-4 py-3"><span class="status-pill s-${esc(o.STATUS)}">${esc(o.STATUS)}</span></td><td class="px-4 py-3 text-right"><button onclick='openStatus(${JSON.stringify(o).replace(/</g,"\\u003c")})' class="text-xs font-extrabold bg-slate-100 px-3 py-2 rounded-lg">Aksi</button></td></tr>`;
}

async function createOrder(e){
  e.preventDefault(); if(busy)return; busy=true;
  const b=document.getElementById('saveBtn'); b.disabled=true; b.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
  try{
    const data={NAMA:document.getElementById('f-nama').value.trim().toUpperCase(),NO_WA:document.getElementById('f-wa').value.trim(),PAKET:document.getElementById('f-paket').value,BERAT:document.getElementById('f-berat').value,TAGIHAN:document.getElementById('f-tagihan').value};
    const j=await api('order_create',data);
    document.getElementById('orderForm').reset(); document.getElementById('f-berat').value='1'; document.getElementById('f-tagihan').value='0';
    const created=j.data?.order;
    if(created){
      const n=normalizeOrder(created);
      orders=[n,...orders.filter(x=>String(normalizeOrder(x).ID)!==String(n.ID))];
      renderSummary(); renderOrders(); renderActionCenter();
    }
    toast('Order berhasil dibuat'+(created?.CODE?' — '+created.CODE:''));
    await loadDashboard(true);
  }catch(e){console.error(e);toast('Gagal membuat order: '+e.message,false)}
  finally{busy=false;b.disabled=false;b.innerHTML='<i class="fa-solid fa-floppy-disk mr-2"></i>Simpan Order'}
}

function openStatus(o){
  selectedOrder=normalizeOrder(o);
  document.getElementById('modalTitle').textContent=selectedOrder.CODE+' — '+selectedOrder.NAMA;
  document.getElementById('modalInfo').innerHTML=`<div><b>Paket:</b> ${esc(selectedOrder.PAKET)}</div><div class="mt-1"><b>Status:</b> ${esc(selectedOrder.STATUS)}</div><div class="mt-1"><b>Deadline:</b> ${esc(selectedOrder.DEADLINE)}</div>`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');selectedOrder=null}

async function updateStatus(newStatus){
  if(!selectedOrder||busy)return;
  const id=selectedOrder.ID; if(!id){toast('ID order tidak ditemukan',false);return}
  busy=true;
  try{
    const j=await api('update_status',{ID:id,STATUS:newStatus});
    // Immediate UI update so the action visibly succeeds without waiting for a full read.
    orders=orders.map(x=>String(normalizeOrder(x).ID)===String(id)?{...x,STATUS:newStatus,UPDATED_AT:j.data?.UPDATED_AT||new Date().toISOString(),READY_AT:j.data?.READY_AT||x.READY_AT||''}:x);
    closeModal(); renderSummaryFromOrders(); renderOrders(); renderActionCenter();
    toast('Update berhasil — '+newStatus);
    // Re-read in background to confirm database state.
    await loadDashboard(true);
  }catch(e){console.error(e);toast('Update gagal: '+e.message,false)}
  finally{busy=false}
}

function renderSummaryFromOrders(){
 const a=orders.map(normalizeOrder);
 summary={...summary,total:a.length,diterima:a.filter(x=>x.STATUS==='DITERIMA').length,diproses:a.filter(x=>x.STATUS==='DIPROSES').length,qc:a.filter(x=>x.STATUS==='QC').length,siap:a.filter(x=>x.STATUS==='SIAP').length,selesai:a.filter(x=>x.STATUS==='SELESAI').length};
 renderSummary();
}
function scrollToOrders(){document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth',block:'start'})}

document.addEventListener('DOMContentLoaded',()=>loadDashboard());
</script>
</body>
</html>
